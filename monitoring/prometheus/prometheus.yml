# Prometheus for Bastion-Tracker (see ../README.md). Started by: docker compose --profile monitoring up -d
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: tracker
    static_configs:
      - targets: ["tracker:9091"]   # metrics.port in config/config.yaml
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
