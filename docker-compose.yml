version: "3.9"

services:
  tracker:
    build: .
    image: bastion/tracker:dev
    ports:
      - "8080:8080"   # REST + UI dashboard
      - "9090:9090"   # gRPC
      - "127.0.0.1:9091:9091"   # Prometheus metrics (unauthenticated: keep off public networks)
    volumes:
      - ./config:/etc/tracker
    environment:
      - CONFIG_PATH=/etc/tracker/config.yaml
      # Required: signs the audit log (>= 32 bytes), e.g. TRACKER_AUDIT_SECRET=$(openssl rand -hex 32)
      - TRACKER_AUDIT_SECRET=${TRACKER_AUDIT_SECRET:?set TRACKER_AUDIT_SECRET (>= 32 bytes)}
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--http_port", "8222", "--js"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Monitoring stack: docker compose --profile monitoring up -d   (see monitoring/README.md)
  # The UIs are published on localhost only; Prometheus and Alertmanager have no authentication.
  prometheus:
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9092:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    profiles:
      - monitoring
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.35.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    profiles:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.2
    environment:
      # Set GRAFANA_ADMIN_PASSWORD. Without it Grafana starts with its default admin/admin login.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
